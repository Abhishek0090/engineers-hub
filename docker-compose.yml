# Local MongoDB for Software Engineers Hub.
#   npm run db:up      start MongoDB on localhost:27017
#   npm run db:seed    copy the JSON content and users into it
# then set DATA_SOURCE=mongo in .env.local and restart `npm run dev`.
services:
  mongo:
    image: mongo:8
    container_name: seh-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: seh-mongo-express
    profiles: ["tools"]
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

volumes:
  mongo-data:
